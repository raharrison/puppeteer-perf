name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Verify modules resolve
        run: node -e "import('./src/measure/page-load.js').then(() => console.log('OK'))"

      - name: Verify report template
        run: node -e "import('./src/report/generate.js').then(() => console.log('OK'))"

      - name: Verify storage
        run: node -e "import('./src/storage/store.js').then(() => console.log('OK'))"
